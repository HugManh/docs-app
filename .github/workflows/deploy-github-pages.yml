name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - quartz

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      # - name: Checkout external repository
      #   uses: actions/checkout@v4
      #   with:
      #     repository: HugManh/brain-IT
      #     ref: development
      #     path: content
      #     token: ${{ secrets.REPO_TOKEN }}
      - name: Checkout external repository
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }} # Nếu repo private, cần token
        run: |
          git clone --no-checkout https://$REPO_TOKEN@github.com/HugManh/brain-IT.git external-repo
          cd external-repo
          git sparse-checkout init --cone
          git sparse-checkout set Categories Attachments # Chỉ định hai thư mục cần lấy
          git checkout main # Thay 'main' bằng nhánh của repo cần clone
      - name: Copy content to folder
        run: |
          cp -r external-repo/Categories/* content/
          cp -r external-repo/Attachments content/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
