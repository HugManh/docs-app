name: Tasks Workflow

on:
  schedule:
    - cron: "*/1 * * * *" # chạy mỗi 1 phút
    # - cron: "0 23 * * *" # mỗi ngày 23:00 chạy 1 lần

jobs:
  trigger-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Quartz site to GitHub Pages
        uses: peter-evans/workflow-dispatch@v1
        with:
          workflow: Deploy Quartz site to GitHub Pages
          ref: quartz
