# yaml-language-server: $schema=../../quartz/plugins/quartz-plugins.schema.json
# Cấu hình Quartz cho site brain-it (dựa trên template "obsidian" của Quartz v5).
# scripts/build-site.sh copy file này ra gốc repo trước khi build.
# Nội dung lấy từ vault theo sites/brain-it/sync.map.
configuration:
  pageTitle: Brain-IT
  pageTitleSuffix: " · Brain-IT"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: vi-VN
  baseUrl: hugmanh.github.io/docs-app/brain-it
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # MOC mẫu chưa điền nội dung trong vault
    - Home.md
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Font có đủ dấu tiếng Việt
      header: Be Vietnam Pro
      body: Be Vietnam Pro
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fcfcfa"
        lightgray: "#e6e6e3"
        gray: "#b4b4ae"
        darkgray: "#3f3f3c"
        dark: "#1f1f1d"
        secondary: "#2f5d8a"
        tertiary: "#6a9a8f"
        highlight: rgba(47, 93, 138, 0.10)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#2f2f33"
        gray: "#5c5c63"
        darkgray: "#d6d6d9"
        dark: "#f0f0f2"
        secondary: "#8ab4dc"
        tertiary: "#84a59d"
        highlight: rgba(138, 180, 220, 0.12)
        textHighlight: "#b3aa0288"
plugins:
  # ---------- Transformers ----------
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      # author/cssclasses/... chỉ có ý nghĩa trong Obsidian, không hiện trên web
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      # scripts/sync-vault.sh đặt mtime của bản copy = commit cuối của file trong vault,
      # nên filesystem đứng trước (note-properties tự gán modified = created nếu thiếu `updated`).
      priority:
        - filesystem
        - frontmatter
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
      condition: has-toc
  - source: "@quartz-community/bases-page"
    enabled: true
    options:
      linkResolution: shortest
    order: 50
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # Link tới note chưa viết -> thêm class "broken", custom.scss hiển thị như chữ thường
      disableBrokenWikilinks: true
      openLinksInNewTab: true
      lazyLoad: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true

  # ---------- Filters ----------
  - source: "@quartz-community/remove-draft"
    enabled: true

  # ---------- Emitters ----------
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true

  # ---------- Page types ----------
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true

  # ---------- Components: cột trái ----------
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Chỉ hiện các chủ đề (MOC), không hiện cây thư mục của vault — xem quartz.ts
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Khám phá
      folderClickBehavior: link
      folderDefaultState: open
      useSavedState: false
    layout:
      position: left
      priority: 50

  # ---------- Components: thân bài ----------
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: Trang chủ
      resolveFrontmatterTitle: true
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags

  # ---------- Components: cột phải ----------
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 20
      condition: has-backlinks
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 1
        showTags: false
        removeTags:
          - moc
      globalGraph:
        showTags: false
        removeTags:
          - moc
    layout:
      position: right
      priority: 30

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/HugManh
        daily.dev: https://app.daily.dev/hugmahdino
    layout:
      position: footer
      priority: 50

  # ---------- Không dùng ----------
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    bases: {}
